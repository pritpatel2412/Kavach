# Stage dictionaries. Phrases are normalised at load time (lowercase, no punctuation, no nukta).
# Add real ASR mis-spellings you observe in saved transcripts (see docs/DETECTION_SPEC.md).
# Rules of thumb: prefer multi-word phrases; avoid words that are common in normal Hinglish
# speech (e.g. "fir" = "phir"). Single-word entries must be distinctive (cbi, trai, warrant).

