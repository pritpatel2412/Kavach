[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kavach-detector"
version = "0.1.0"
description = "Scam-call stage detector for Kavach (rule-based scorer, no network)."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "rapidfuzz>=3.0"]

[tool.setuptools.packages.find]
include = ["kavach_detector*"]

[tool.setuptools.package-data]
kavach_detector = ["dictionaries/*.yaml"]
