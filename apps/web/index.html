<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kavach</title>
<style>
  :root { --bg:#0f1419; --fg:#f4f1ea; --ok:#2e9e5b; --warn:#e0a21a; --bad:#d6382f; --mut:#8a94a0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Noto Sans Devanagari", sans-serif; background:var(--bg); color:var(--fg);
         min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px; gap:20px; }
  h1 { margin:0; font-size:20px; letter-spacing:.08em; color:var(--mut); }
  #ring { width:220px; height:220px; border-radius:50%; border:14px solid var(--ok); display:flex; align-items:center;
          justify-content:center; text-align:center; font-size:26px; padding:18px; transition:border-color .3s; }
  #ring.l1 { border-color: var(--warn); } #ring.l2, #ring.l3 { border-color: var(--bad); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  #msg { font-size:30px; min-height:80px; text-align:center; max-width:640px; font-weight:600; }
  button { font-size:26px; padding:18px 34px; border-radius:16px; border:0; background:var(--ok); color:#fff; cursor:pointer; }
  button.stop { background:#444; }
  #help { display:none; background:var(--bad); }
  #judge { display:none; width:100%; max-width:900px; border-top:1px solid #2a323b; padding-top:16px; }
  body.judge #judge { display:block; }
  .meter { height:14px; background:#222a33; border-radius:8px; overflow:hidden; }
  .meter > div { height:100%; width:0; background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad)); transition:width .4s; }
  .chips { display:flex; gap:8px; margin:12px 0; flex-wrap:wrap; }
  .chip { padding:6px 12px; border-radius:999px; background:#222a33; color:var(--mut); font-size:14px; }
  .chip.on { background:var(--bad); color:#fff; }
  #log { font-family: ui-monospace, monospace; font-size:13px; max-height:260px; overflow:auto; color:var(--mut); }
  #log div { padding:3px 0; border-bottom:1px solid #1a2128; }
  .badge { font-size:12px; padding:3px 8px; border:1px solid var(--warn); color:var(--warn); border-radius:6px; }
</style>
</head>
<body>
<h1>KAVACH <span class="badge" id="synthetic" style="display:none">SYNTHETIC / ROLE-PLAYED CALL</span></h1>
<div id="ring">सुरक्षित</div>
<div id="msg">Kavach बंद है</div>
<button id="toggle">सुनना शुरू करो</button>
<a href="tel:1930"><button id="help">1930 पर कॉल करें</button></a>
<section id="judge">
  <div class="meter"><div id="meterFill"></div></div>
  <div class="chips" id="chips"></div>
  <div id="stats"></div>
  <div id="log"></div>
</section>
<script src="app.js"></script>
</body>
</html>
