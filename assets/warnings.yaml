hi-IN:
  1:
    clip_text: "ज़रा रुकिए। यह कॉल संदिग्ध लग रही है। कोई भी पैसे ट्रांसफर मत कीजिए।"
    screen_text: "सावधान! यह कॉल संदिग्ध है"
  2:
    clip_text: "रुकिए! यह स्कैम है। पुलिस या सीबीआई फ़ोन पर किसी को गिरफ़्तार नहीं करती। फ़ोन काट दीजिए।"
    screen_text: "यह स्कैम है! फ़ोन काट दीजिए"
  3:
    clip_text: "फ़ोन काट दीजिए। आपके परिवार को सूचना भेज दी गई है। साइबर हेल्पलाइन, एक नौ तीन शून्य, पर कॉल कीजिए।"
    screen_text: "फ़ोन काटें। 1930 पर कॉल करें"
